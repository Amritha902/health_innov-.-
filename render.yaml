services:
  - type: web
    name: riaya
    runtime: python
    plan: free
    branch: claude/epic-goodall-arivj6
    buildCommand: pip install -r requirements.txt && python validation/run_validation.py --seed-demo
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/graph
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
