services:
  - type: web
    name: riaya
    runtime: python
    plan: free
    branch: claude/epic-goodall-arivj6
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/graph
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: riaya-db
          property: connectionString
      - key: RIAYA_DATA_KEY
        generateValue: true
      - key: RIAYA_PHONE_SALT
        generateValue: true
      - key: RIAYA_CLINICIAN_USER
        sync: false
      - key: RIAYA_CLINICIAN_PASSWORD
        sync: false

databases:
  - name: riaya-db
    plan: free
