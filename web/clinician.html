<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Riaya Clinician Console</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Riaya">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<style>
.layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
.qlist { max-height: calc(100vh - 140px); overflow-y: auto; }
.ws { display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.wcol > h3 { margin: 0 0 10px; color: var(--muted); font-weight: 500; }
.card.tight { padding: 16px 18px; margin: 0 0 12px; }
.wcol.mid .grid2 { gap: 12px; }
.steps2 { list-style: none; padding: 0; margin: 10px 0; font-size: 13px; }
.steps2 li { padding: 4px 0 4px 22px; position: relative; color: var(--muted); }
.steps2 li::before { content: ""; position: absolute; left: 4px; top: 10px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); }
.steps2 li.done { color: var(--ink); } .steps2 li.done::before { background: var(--good); border-color: var(--good); }
.steps2 li.stop { color: var(--alert); } .steps2 li.stop::before { background: var(--alert); border-color: var(--alert); }
.evx { border-color: var(--saffron); }
@media (max-width: 1400px) { .ws { grid-template-columns: 1fr 1fr; } .ws .mid { grid-column: span 2; order: -1; } }
@media (max-width: 1100px) { .layout, .ws { grid-template-columns: 1fr; } .ws .mid { grid-column: auto; } }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.qitem { padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; cursor: pointer; background: var(--bg); }
.qitem.on { border-color: var(--brand); }
.bar { height: 14px; background: var(--brand); border-radius: 3px; }
.bar.neg { background: var(--info); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 14px; }
.tabs button { margin-inline-end: 6px; }
.tabs button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
svg text { fill: var(--ink); font: 12px var(--font); }
.stat { font-size: 26px; font-weight: 700; }
</style>
</head>
<body data-no-hide="1">
<header class="top"><div class="brand"><i></i>Riaya · Clinician console</div><div class="spacer"></div>
  <span class="muted" id="who"></span><button class="chip hidden" id="logout">Sign out</button></header>
<main class="wrap wide" id="view" style="max-width:1680px"></main>
<script src="js/common.js"></script>
<script src="js/clinician.js"></script>
</body>
</html>
