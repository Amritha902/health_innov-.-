<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Riaya | رعاية</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Riaya">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<style>
body { display: flex; flex-direction: column; min-height: 100vh; }
.chat { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; padding: 16px 16px 8px; }
.bubble { width: fit-content; max-width: 85%; padding: 14px 18px; border-radius: 22px; margin: 8px 0; line-height: 1.6; white-space: pre-line; }
.bot { background: var(--surface); box-shadow: var(--shadow); border-start-start-radius: 6px; }
.me { background: var(--brand); color: var(--brand-ink); margin-inline-start: auto; border-start-end-radius: 4px; }
.me small { opacity: .8; }
.dock { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px 14px; }
.dock .inner { max-width: 720px; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chips .opt { background: var(--surface); }
.inputrow { display: flex; gap: 8px; align-items: center; }
.mic { width: 54px; height: 54px; border-radius: 50%; border: 0; background: radial-gradient(120% 120% at 30% 20%, #2a4361, #0d1b2a); color: var(--brand-ink); font-size: 22px; cursor: pointer; flex: none; }
.mic.live { background: var(--alert); animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(179,57,47,.5); } 100% { box-shadow: 0 0 0 14px rgba(179,57,47,0); } }
.settings { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.settings select { width: auto; padding: 6px 8px; }
.typing { color: var(--muted); font-size: 13px; }
.vset { position: relative; }
.vset summary { text-decoration: none; padding: 8px 12px; border-radius: 999px; color: var(--ink-2); }
.vpanel { position: absolute; inset-inline-end: 0; top: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; width: 280px;
  display: flex; flex-direction: column; gap: 10px; z-index: 10; }
.vpanel select { width: 100%; }
.startpad { display: flex; flex-direction: column; gap: 12px; align-items: stretch; max-width: 320px; margin: 18vh auto 0; }
.bot { border: 1px solid var(--line); box-shadow: none; }
.mic { background: var(--gulf) !important; }
.mic.live { background: var(--alert) !important; }
</style>
</head>
<body class="has-dock">
<header class="top"><div class="brand"><i></i><a href="index.html" style="color:inherit;text-decoration:none" id="brand"></a></div><div class="spacer"></div>
  <div class="settings">
    <details class="vset"><summary id="lblVoice"></summary>
      <div class="vpanel">
        <label><input type="checkbox" id="voiceOn" checked> <span>🔊</span></label>
        <select id="voice" aria-label="voice"></select>
        <label><input type="checkbox" id="handsFree"> <span id="lblHands"></span></label>
        <label><input type="checkbox" id="private"> <span id="lblPrivate"></span></label>
        <div class="muted small" id="voiceNote"></div>
      </div></details>
    <button class="chip" id="langBtn"></button>
  </div>
</header>
<main class="chat" id="log" aria-live="polite"></main>
<div class="dock"><div class="inner">
  <div class="chips" id="chips"></div>
  <div class="inputrow">
    <button class="mic" id="mic" aria-label="speak"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f1ece3" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input type="text" id="text" autocomplete="off">
    <button class="btn" id="send"></button>
  </div>
  <div class="muted small" id="micNote" style="margin-top:6px"></div>
</div></div>
<script src="js/common.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nlu.js"></script>
<script src="js/voice.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
