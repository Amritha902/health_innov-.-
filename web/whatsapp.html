<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Riaya on WhatsApp</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2a3a">
<link rel="stylesheet" href="css/app.css">
<style>
.layout { display: grid; grid-template-columns: 1fr 380px; gap: clamp(24px, 5vw, 64px); align-items: start; max-width: 1080px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 80px; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.phone { border-radius: 38px; background: #0b141a; padding: 12px; box-shadow: 0 30px 60px -30px rgba(15,42,58,.55); }
.screen2 { border-radius: 28px; overflow: hidden; background: #efe7de; display: flex; flex-direction: column; height: 640px; }
.bar { background: #0f2a3a; color: #eef0ec; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.bar i { width: 34px; height: 34px; border-radius: 50%; background: #16303f; display: grid; place-items: center; }
.bar i::after { content: ""; width: 14px; height: 14px; background: #c9932e; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.bar small { display: block; color: #9fb2bd; font-size: 12px; }
.feed { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px;
  background-image: radial-gradient(rgba(15,42,58,.05) 1px, transparent 1px); background-size: 16px 16px; }
.m { max-width: 82%; padding: 8px 10px 6px; border-radius: 10px; font-size: 14.5px; line-height: 1.5; white-space: pre-line; color: #111b21; word-break: break-word; }
.m.in { background: #fff; align-self: flex-start; border-start-start-radius: 2px; }
.m.out { background: #d9fdd3; align-self: flex-end; border-start-end-radius: 2px; }
.m a { color: #027eb5; }
.m .opt-line { display: inline; cursor: pointer; border-radius: 6px; padding: 1px 4px; margin: 0 -4px; }
.m .opt-line:hover { background: #eef3f5; }
.compose { display: flex; gap: 8px; padding: 8px; background: #f0f2f5; }
.compose input { border-radius: 999px; border: 0; padding: 11px 16px; background: #fff; }
.compose button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #0f2a3a; color: #fff; cursor: pointer; flex: none; }
.side h1 { margin-top: 24px; }
.qr { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; border: 1px solid var(--line); }
ol.how { padding-inline-start: 20px; color: var(--ink-2); }
</style>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<header class="top"><a class="brand" href="index.html"><i></i><span id="brand"></span></a><div class="spacer"></div><button class="chip" id="langBtn"></button></header>
<div class="layout">
  <div class="side">
    <h1 id="h"></h1><p class="lead" id="lead"></p>
    <ol class="how" id="how"></ol>
    <div id="live"></div>
  </div>
  <div class="phone"><div class="screen2">
    <div class="bar"><i></i><div><b>Riaya</b><small id="sub"></small></div></div>
    <div class="feed" id="feed"></div>
    <form class="compose" id="f"><input id="msg" autocomplete="off"><button aria-label="send">➤</button></form>
  </div></div>
</div>
<script src="js/common.js"></script>
<script src="js/i18n.js"></script>
<script>
const W = {
  en: { h: "No app to download. Just WhatsApp.", lead: "Most men in the UAE already use WhatsApp every day. Riaya runs the same private check there: no install, no account, no icon on his phone, and one word erases everything.",
    how: ["He scans a plain card at a pharmacy, gym or clinic, or texts the number.", "He answers by number or in his own words, in Arabic or English.", "He gets his next step, plus a private link to the full summary, IFHAS hand-off and doctor messages.", "Sending “delete” erases the conversation and all data."],
    sub: "Private health check", ph: "Message", tryHere: "Try the conversation on the right, exactly as it runs on WhatsApp.",
    scan: "Scan to start on your own phone", notSet: "Live WhatsApp number: set RIAYA_WHATSAPP_NUMBER (Twilio sandbox or sender) to show a QR code here." },
  ar: { h: "بلا تطبيق للتحميل. واتساب فقط.", lead: "معظم الرجال في الإمارات يستخدمون واتساب يومياً. تعمل رعاية بالفحص الخاص نفسه هناك: بلا تثبيت ولا حساب ولا أيقونة على هاتفه، وكلمة واحدة تمسح كل شيء.",
    how: ["يمسح بطاقة بسيطة في صيدلية أو نادٍ أو عيادة، أو يراسل الرقم.", "يجيب برقم أو بكلماته، بالعربية أو الإنجليزية.", "يحصل على خطوته التالية ورابط خاص للملخص الكامل وتسليم «إفحص» ورسائل الطبيب.", "إرسال «حذف» يمسح المحادثة وكل البيانات."],
    sub: "فحص صحي خاص", ph: "رسالة", tryHere: "جرّب المحادثة على اليمين، تماماً كما تعمل على واتساب.",
    scan: "امسح لتبدأ على هاتفك", notSet: "رقم واتساب المباشر: اضبط RIAYA_WHATSAPP_NUMBER (بيئة Twilio التجريبية أو رقم رسمي) لعرض رمز QR هنا." },
};
let session = sessionStorage.getItem("wa_demo");
if (!session) { session = crypto.getRandomValues(new Uint32Array(4)).join("-"); sessionStorage.setItem("wa_demo", session); }
const feed = () => $("#feed");
function add(text, dir) {
  const d = document.createElement("div");
  d.className = "m " + dir;
  if (dir === "in") {
    d.innerHTML = esc(text).replace(/\*(.+?)\*/g, "<b>$1</b>").replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .split("\n").map(l => /^\d+\. /.test(l) ? `<span class="opt-line" data-n="${l.split(".")[0]}">${l}</span>` : l).join("\n");
    d.querySelectorAll(".opt-line").forEach(x => x.onclick = () => send(x.dataset.n));
  } else d.textContent = text;
  feed().appendChild(d); feed().scrollTop = feed().scrollHeight;
}
async function send(text) {
  if (text) add(text, "out");
  const r = await API.post("/api/conversation/demo", { session, text });
  for (const m of r.replies) { await new Promise(res => setTimeout(res, 350)); add(m, "in"); }
}
function render() {
  applyLang();
  const L = W[LANG];
  $("#brand").textContent = t("app"); $("#langBtn").textContent = t("lang");
  $("#h").textContent = L.h; $("#lead").textContent = L.lead; $("#sub").textContent = L.sub; $("#msg").placeholder = L.ph;
  $("#how").innerHTML = L.how.map(x => `<li>${x}</li>`).join("") ;
  API.get("/api/config").then(c => {
    if (!c.whatsapp_number) { $("#live").innerHTML = `<p class="muted small">${L.tryHere}</p><p class="muted small">${L.notSet}</p>`; return; }
    const link = `https://wa.me/${c.whatsapp_number.replace(/\D/g, "")}?text=${encodeURIComponent(c.whatsapp_join || "مرحبا")}`;
    $("#live").innerHTML = `<p class="muted small">${L.tryHere}</p><h3>${L.scan}</h3><div class="qr" id="qr"></div><p class="small"><a href="${link}">${link}</a></p>`;
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload = () => new QRCode($("#qr"), { text: link, width: 160, height: 160, colorDark: "#0f2a3a" });
    document.head.appendChild(s);
  }).catch(() => {});
}
$("#f").onsubmit = e => { e.preventDefault(); const v = $("#msg").value.trim(); if (v) { $("#msg").value = ""; send(v); } };
$("#langBtn").onclick = () => { LANG = LANG === "ar" ? "en" : "ar"; store.set("lang", LANG); render(); };
render();
send("");
</script>
</body>
</html>
