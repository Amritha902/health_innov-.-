<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Riaya | رعاية</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Riaya">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top"><div class="brand"><i></i><span id="brand"></span></div><div class="spacer"></div><button class="chip" id="langBtn"></button></header>
<main class="wrap" id="view"></main>
<script src="js/common.js"></script>
<script src="js/i18n.js"></script>
<script>
const P = {
  en: { title: "A shared starting point", gone: "This link has expired or was withdrawn.", on: "Completed on",
        note: "Men's reproductive health is half of the picture. When both partners are checked at the same time, couples get answers sooner and avoid unnecessary tests.",
        own: "Only his choice to share this. It shows no answers or results." },
  ar: { title: "نقطة بداية مشتركة", gone: "انتهت صلاحية هذا الرابط أو تم سحبه.", on: "تاريخ الإكمال",
        note: "صحة الرجل الإنجابية نصف الصورة. عندما يُفحص الزوجان في الوقت نفسه، يحصلان على الإجابات أسرع ويتجنبان فحوصات غير ضرورية.",
        own: "هذه المشاركة باختياره فقط، ولا تعرض أي إجابات أو نتائج." },
};
let data = null;
// token travels in the URL fragment, which browsers never send to the server or in Referer headers
const token = location.hash.slice(1);
async function load() {
  try { data = await API.get(`/api/partner/${encodeURIComponent(token)}`); } catch { data = null; }
  render();
}
function render() {
  applyLang();
  const L = P[LANG];
  $("#brand").textContent = t("app"); $("#langBtn").textContent = t("lang");
  $("#view").innerHTML = data ? `<h1>${L.title}</h1><div class="card next"><h2>${esc(data.message[LANG])}</h2><p class="muted small">${L.on}: ${esc(data.completed_on)}</p></div>
    <p class="muted">${L.note}</p><p class="muted small">${L.own}</p>` : `<div class="card"><p>${L.gone}</p></div>`;
}
$("#langBtn").onclick = () => { LANG = LANG === "ar" ? "en" : "ar"; store.set("lang", LANG); render(); };
load();
</script>
</body>
</html>
